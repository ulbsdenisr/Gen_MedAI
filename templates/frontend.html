<!DOCTYPE html>
<html>
<head>
    <title>Medical Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #6699ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            height: 85vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #f8f9fc;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #e3e6f0;
        }

        #chatbox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fc;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .user {
            background: #4e73df;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        .bot {
            background: #e2e6ea;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 3px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e3e6f0;
            background: white;
        }

        #message {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: #6699ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3377ff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Medical Assistant</div>

    <div id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Describe your symptoms..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chatbox = document.getElementById("chatbox");
    const userText = input.value;

    if (!userText) return;

    // Add user message
    chatbox.innerHTML += `<div class="message user">${userText}</div>`;
    input.value = "";

    chatbox.scrollTop = chatbox.scrollHeight;

    // Call backend
    const response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: userText })
    });

    const data = await response.json();

    // Add bot reply
    chatbox.innerHTML += `<div class="message bot">${data.reply}</div>`;

    chatbox.scrollTop = chatbox.scrollHeight;
}

// Allow Enter key to send
document.getElementById("message")
    .addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
